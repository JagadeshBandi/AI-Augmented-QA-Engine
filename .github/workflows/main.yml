name: ARES Intelligent CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_vision_tests:
        description: 'Run advanced vision healing tests'
        required: false
        default: false
        type: boolean
      run_risk_analysis:
        description: 'Run predictive risk analysis'
        required: false
        default: false
        type: boolean
      run_performance_tests:
        description: 'Run performance benchmarks'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  setup:
    name: 'Setup Environment'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.local/share/playwright
          node_modules
        key: ${{ runner.os }}-ares-${{ hashFiles('**/requirements.txt', '**/package*.json') }}
        restore-keys: |
          ${{ runner.os }}-ares-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright pytest-html allure-pytest
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Node dependencies
      run: |
        if [ -f package.json ]; then npm ci; fi
    
    - name: Create required directories
      run: |
        mkdir -p data/models assets/templates reports allure-results
    
    - name: Verify installation
      run: |
        python --version
        pytest --version
        playwright --version

  ai-training:
    name: 'AI Model Training'
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      model-accuracy: ${{ steps.train.outputs.accuracy }}
      risk-model-trained: ${{ steps.train.outputs.risk-model-trained }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install scikit-learn pandas numpy opencv-python
    
    - name: Train AI Vision Models
      id: train
      run: |
        python -c "
        from src.model.advanced_vision_healer import get_advanced_vision_healer
        from src.model.risk_predictor import get_risk_predictor
        
        print('=== Training AI Vision Models ===')
        vision_healer = get_advanced_vision_healer()
        vision_performance = vision_healer.get_performance_report()
        print(f'Vision Healing Performance: {vision_performance}')
        
        print('=== Training Risk Prediction Models ===')
        risk_predictor = get_risk_predictor()
        training_results = risk_predictor.train_risk_models()
        
        if 'error' in training_results:
            print(f'Training Error: {training_results[\"error\"]}')
            echo 'risk-model-trained=false' >> \$GITHUB_OUTPUT
            echo 'accuracy=0.0' >> \$GITHUB_OUTPUT
        else:
            print(f'Training Results: {training_results}')
            echo 'risk-model-trained=true' >> \$GITHUB_OUTPUT
            echo 'accuracy=' + str(training_results.get('ensemble_accuracy', 0.0)) >> \$GITHUB_OUTPUT
        
        print('=== AI Training Complete ===')
        "
    
    - name: Upload AI Models
      uses: actions/upload-artifact@v3
      with:
        name: ai-models
        path: |
          data/models/
          assets/templates/
        retention-days: 30

  vision-healing-tests:
    name: 'Vision Healing Tests'
    runs-on: ubuntu-latest
    needs: [setup, ai-training]
    if: github.event.inputs.run_vision_tests == 'true' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install opencv-python-headless pytest-playwright
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Download AI Models
      uses: actions/download-artifact@v3
      with:
        name: ai-models
        path: data/
    
    - name: Run Vision Healing Tests
      run: |
        python -c "
        from src.model.advanced_vision_healer import get_advanced_vision_healer
        import cv2
        import numpy as np
        from pathlib import Path
        
        print('=== Advanced Vision Healing Tests ===')
        healer = get_advanced_vision_healer()
        
        # Test template matching
        print('1. Testing Template Matching...')
        template_path = 'assets/templates/login_button.png'
        if Path(template_path).exists():
            result = healer.heal_element_with_vision('login_button', 'test_screenshot.png')
            print(f'   Template Matching Result: {result.success}')
            print(f'   Confidence: {result.confidence:.2f}')
            print(f'   Method: {result.method_used.value}')
            print(f'   Healing Time: {result.healing_time:.3f}s')
        else:
            print('   Template not found, creating placeholder...')
        
        # Test sensor fusion
        print('2. Testing Sensor Fusion...')
        performance = healer.get_performance_report()
        print(f'   Total Healings: {performance[\"total_healings\"]}')
        print(f'   Success Rate: {performance[\"overall_success_rate\"]:.2%}')
        print(f'   Average Confidence: {performance[\"average_confidence\"]:.2f}')
        print(f'   MTTR Reduction: {performance[\"mttr_reduction\"]:.1%}')
        
        print('=== Vision Healing Tests Complete ===')
        "
    
    - name: Generate Vision Report
      run: |
        python -c "
        from src.model.advanced_vision_healer import get_advanced_vision_healer
        import json
        
        healer = get_advanced_vision_healer()
        report = healer.get_performance_report()
        
        with open('reports/vision_healing_report.json', 'w') as f:
            json.dump(report, f, indent=2)
        
        print('Vision healing report generated')
        "
    
    - name: Upload Vision Reports
      uses: actions/upload-artifact@v3
      with:
        name: vision-reports
        path: reports/
        retention-days: 7

  risk-analysis:
    name: 'Predictive Risk Analysis'
    runs-on: ubuntu-latest
    needs: [setup, ai-training]
    if: github.event.inputs.run_risk_analysis == 'true' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install scikit-learn pandas numpy gitpython
    
    - name: Download AI Models
      uses: actions/download-artifact@v3
      with:
        name: ai-models
        path: data/
    
    - name: Run Risk Analysis
      run: |
        python -c "
        from src.model.risk_predictor import get_risk_predictor
        import json
        
        print('=== Predictive Risk Analysis ===')
        predictor = get_risk_predictor()
        
        # Extract git features
        print('1. Extracting Git Features...')
        features = predictor.extract_git_features('.', since_days=7)
        print(f'   Found {len(features)} commits in last 7 days')
        
        # Predict risks for modules
        print('2. Predicting Module Risks...')
        modules = ['authentication', 'payment_processing', 'user_registration', 'api_endpoints']
        predictions = predictor.predict_batch_risks(modules)
        
        high_risk_modules = []
        for pred in predictions:
            print(f'   {pred.module_name}: {pred.risk_level.value} ({pred.risk_score:.2f})')
            if pred.risk_level.value in ['HIGH', 'CRITICAL']:
                high_risk_modules.append(pred.module_name)
        
        # Generate risk summary
        print('3. Risk Summary:')
        dashboard_data = predictor.get_risk_dashboard_data()
        print(f'   Model Version: {dashboard_data[\"model_version\"]}')
        print(f'   Training Accuracy: {dashboard_data[\"training_accuracy\"]:.2f}')
        print(f'   High Risk Modules: {len(high_risk_modules)}')
        
        if high_risk_modules:
            print(f'   High Risk: {high_risk_modules}')
        
        # Save risk analysis report
        risk_report = {
            'timestamp': '${{ github.run_number }}',
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}',
            'predictions': [
                {
                    'module': pred.module_name,
                    'risk_score': pred.risk_score,
                    'risk_level': pred.risk_level.value,
                    'confidence': pred.confidence,
                    'factors': pred.contributing_factors,
                    'recommendations': pred.recommended_actions
                } for pred in predictions
            ],
            'high_risk_modules': high_risk_modules,
            'model_info': dashboard_data
        }
        
        with open('reports/risk_analysis_report.json', 'w') as f:
            json.dump(risk_report, f, indent=2)
        
        print('=== Risk Analysis Complete ===')
        "
    
    - name: Upload Risk Reports
      uses: actions/upload-artifact@v3
      with:
        name: risk-reports
        path: reports/
        retention-days: 7

  test-execution:
    name: 'ARES Test Suite'
    runs-on: ubuntu-latest
    needs: [setup, ai-training]
    strategy:
      matrix:
        test-type: [smoke, regression, integration, vision]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright pytest-html allure-pytest
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Download AI Models
      uses: actions/download-artifact@v3
      with:
        name: ai-models
        path: data/
    
    - name: Run ARES Tests
      run: |
        echo "Running ${{ matrix.test-type }} tests with AI healing..."
        
        case "${{ matrix.test-type }}" in
          "smoke")
            pytest tests/test_login.py::test_basic_login_functionality -v --html=reports/smoke.html --self-contained-html
            ;;
          "regression")
            pytest tests/test_advanced_login.py::TestAdvancedLogin::test_successful_login -v --html=reports/regression.html --self-contained-html
            ;;
          "integration")
            pytest tests/test_integration.py -v --html=reports/integration.html --self-contained-html
            ;;
          "vision")
            pytest tests/test_login.py::test_ai_healing_capabilities -v --html=reports/vision.html --self-contained-html
            ;;
        esac
    
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report || echo "Allure not available"
    
    - name: Upload Test Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.test-type }}
        path: |
          reports/
          allure-report/
        retention-days: 7

  performance-benchmarks:
    name: 'Performance Benchmarks'
    runs-on: ubuntu-latest
    needs: [setup]
    if: github.event.inputs.run_performance_tests == 'true' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright pytest-benchmark
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run Performance Tests
      run: |
        pytest tests/test_performance.py --benchmark-only --benchmark-json=reports/benchmark.json --benchmark-autosave
    
    - name: Analyze Performance
      run: |
        python -c "
        import json
        import statistics
        
        try:
            with open('reports/benchmark.json', 'r') as f:
                data = json.load(f)
            
            benchmarks = data.get('benchmarks', [])
            if benchmarks:
                durations = [b.get('stats', {}).get('min', 0) for b in benchmarks]
                avg_duration = statistics.mean(durations) if durations else 0
                
                performance_score = max(0, 100 - avg_duration * 10)
                
                print(f'Performance Score: {performance_score:.1f}')
                print(f'Average Duration: {avg_duration:.3f}s')
                print(f'Total Benchmarks: {len(benchmarks)}')
                
                with open('reports/performance_summary.json', 'w') as f:
                    json.dump({
                        'performance_score': performance_score,
                        'average_duration': avg_duration,
                        'total_benchmarks': len(benchmarks),
                        'timestamp': '${{ github.run_number }}'
                    }, f, indent=2)
        except Exception as e:
            print(f'Performance analysis failed: {e}')
        "
    
    - name: Upload Performance Reports
      uses: actions/upload-artifact@v3
      with:
        name: performance-reports
        path: reports/
        retention-days: 7

  quality-gates:
    name: 'Quality Gates'
    runs-on: ubuntu-latest
    needs: [test-execution, risk-analysis, vision-healing-tests]
    if: always()
    
    steps:
    - name: Download All Reports
      uses: actions/download-artifact@v3
      with:
        path: reports/
    
    - name: Quality Gate Analysis
      run: |
        python -c "
        import json
        import os
        from pathlib import Path
        
        print('=== ARES Quality Gate Analysis ===')
        
        # Initialize quality metrics
        quality_metrics = {
            'test_results': {},
            'risk_analysis': {},
            'vision_healing': {},
            'overall_score': 0,
            'status': 'PENDING'
        }
        
        # Analyze test results
        test_reports = list(Path('reports').glob('test-reports-*'))
        for report_dir in test_reports:
            test_type = report_dir.name.replace('test-reports-', '')
            html_files = list(report_dir.glob('*.html'))
            
            if html_files:
                quality_metrics['test_results'][test_type] = {
                    'status': 'PASSED',
                    'reports': len(html_files)
                }
            else:
                quality_metrics['test_results'][test_type] = {
                    'status': 'FAILED',
                    'reports': 0
                }
        
        # Analyze risk analysis
        risk_files = list(Path('reports').glob('risk-reports/*'))
        if risk_files:
            for risk_file in risk_files:
                if risk_file.name == 'risk_analysis_report.json':
                    with open(risk_file, 'r') as f:
                        risk_data = json.load(f)
                    
                    high_risk_count = len(risk_data.get('high_risk_modules', []))
                    quality_metrics['risk_analysis'] = {
                        'high_risk_modules': high_risk_count,
                        'total_modules': len(risk_data.get('predictions', [])),
                        'status': 'WARNING' if high_risk_count > 0 else 'PASSED'
                    }
        
        # Analyze vision healing
        vision_files = list(Path('reports').glob('vision-reports/*'))
        if vision_files:
            for vision_file in vision_files:
                if vision_file.name == 'vision_healing_report.json':
                    with open(vision_file, 'r') as f:
                        vision_data = json.load(f)
                    
                    success_rate = vision_data.get('overall_success_rate', 0)
                    quality_metrics['vision_healing'] = {
                        'success_rate': success_rate,
                        'total_healings': vision_data.get('total_healings', 0),
                        'status': 'PASSED' if success_rate > 0.7 else 'FAILED'
                    }
        
        # Calculate overall quality score
        test_score = 0
        total_tests = len(quality_metrics['test_results'])
        passed_tests = len([t for t in quality_metrics['test_results'].values() if t['status'] == 'PASSED'])
        if total_tests > 0:
            test_score = (passed_tests / total_tests) * 40
        
        risk_score = 40
        if quality_metrics['risk_analysis'].get('status') == 'PASSED':
            risk_score = 40
        elif quality_metrics['risk_analysis'].get('status') == 'WARNING':
            risk_score = 20
        
        vision_score = 20
        if quality_metrics['vision_healing'].get('status') == 'PASSED':
            vision_score = 20
        else:
            vision_score = 10
        
        quality_metrics['overall_score'] = test_score + risk_score + vision_score
        
        # Determine status
        if quality_metrics['overall_score'] >= 80:
            quality_metrics['status'] = 'PASSED'
        elif quality_metrics['overall_score'] >= 60:
            quality_metrics['status'] = 'WARNING'
        else:
            quality_metrics['status'] = 'FAILED'
        
        # Save quality report
        with open('reports/quality_gate_report.json', 'w') as f:
            json.dump(quality_metrics, f, indent=2)
        
        print(f'Overall Quality Score: {quality_metrics[\"overall_score\"]:.1f}/100')
        print(f'Status: {quality_metrics[\"status\"]}')
        print(f'Test Results: {passed_tests}/{total_tests} passed')
        print(f'Risk Analysis: {quality_metrics[\"risk_analysis\"].get(\"status\", \"UNKNOWN\")}')
        print(f'Vision Healing: {quality_metrics[\"vision_healing\"].get(\"status\", \"UNKNOWN\")}')
        
        # Exit with appropriate code
        if quality_metrics['status'] == 'FAILED':
            exit(1)
        elif quality_metrics['status'] == 'WARNING':
            exit(0)
        else:
            exit(0)
        "
    
    - name: Upload Quality Report
      uses: actions/upload-artifact@v3
      with:
        name: quality-gate-report
        path: reports/
        retention-days: 30

  notification:
    name: 'Notification'
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always()
    
    steps:
    - name: Download Quality Report
      uses: actions/download-artifact@v3
      with:
        name: quality-gate-report
        path: reports/
    
    - name: Send Notification
      run: |
        python -c "
        import json
        
        try:
            with open('reports/quality_gate_report.json', 'r') as f:
                report = json.load(f)
            
            status = report.get('status', 'UNKNOWN')
            score = report.get('overall_score', 0)
            
            print(f'ARES CI Pipeline Status: {status}')
            print(f'Quality Score: {score:.1f}/100')
            print(f'Commit: ${{ github.sha }}')
            print(f'Branch: ${{ github.ref_name }}')
            
        except Exception as e:
            print(f'Failed to read quality report: {e}')
        "
