name: ARES QualityOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean
      run_security_tests:
        description: 'Run security tests'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'
  ARES_METRICS_ENABLED: 'true'

jobs:
  # Infrastructure Setup Job
  infrastructure:
    name: 'Setup Infrastructure'
    runs-on: ubuntu-latest
    outputs:
      grafana-url: ${{ steps.infra.outputs.grafana-url }}
      influxdb-url: ${{ steps.infra.outputs.influxdb-url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Start TIG Stack
      id: infra
      run: |
        echo "Starting InfluxDB and Grafana..."
        docker-compose up -d influxdb grafana
        
        # Wait for services to be ready
        echo "Waiting for services to start..."
        sleep 30
        
        # Check service health
        if curl -f http://localhost:8086/health; then
          echo "InfluxDB is healthy"
          echo "grafana-url=http://localhost:3000" >> $GITHUB_OUTPUT
        else
          echo "InfluxDB health check failed"
          exit 1
        fi
        
        if curl -f http://localhost:3000/api/health; then
          echo "Grafana is healthy"
          echo "influxdb-url=http://localhost:8086" >> $GITHUB_OUTPUT
        else
          echo "Grafana health check failed"
          exit 1
        fi
    
    - name: Configure Grafana
      run: |
        echo "Configuring Grafana datasources and dashboards..."
        sleep 10
        
        # Create datasource
        curl -X POST \
          http://localhost:3000/api/datasources \
          -H "Content-Type: application/json" \
          -H "Authorization: Basic $(echo -n admin:admin123 | base64)" \
          -d '{
            "name": "InfluxDB",
            "type": "influxdb",
            "url": "http://localhost:8086",
            "database": "qa_metrics",
            "user": "admin",
            "password": "password123",
            "access": "proxy",
            "isDefault": true
          }' || echo "Datasource may already exist"
    
    - name: Upload infrastructure logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: infrastructure-logs
        path: |
          docker-compose.log
          /tmp/docker-*.log
        retention-days: 7

  # AI Model Training Job
  ai-training:
    name: 'AI Model Training'
    runs-on: ubuntu-latest
    needs: infrastructure
    outputs:
      model-accuracy: ${{ steps.train.outputs.accuracy }}
      risk-predictions: ${{ steps.train.outputs.predictions }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for training
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright scikit-learn pandas numpy opencv-python
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Train AI Models
      id: train
      run: |
        python -c "
        from src.model.predictor import get_defect_predictor
        predictor = get_defect_predictor()
        
        # Train models
        results = predictor.train_models()
        print(f'accuracy={results.get(\"model_accuracy\", 0.0)}')
        
        # Make predictions for current test suite
        test_names = [
            'test_login_functionality',
            'test_payment_processing', 
            'test_user_registration',
            'test_search_functionality',
            'test_api_endpoints',
            'test_ui_components'
        ]
        
        predictions = predictor.predict_batch_risks(test_names)
        summary = predictor.get_risk_summary(predictions)
        
        print('predictions=' + str(len([p for p in predictions if p.risk_score > 0.7])))
        print('high_risk_count=' + str(summary['risk_distribution']['high'] + summary['risk_distribution']['critical']))
        "
    
    - name: Upload AI Models
      uses: actions/upload-artifact@v4
      with:
        name: ai-models
        path: data/models/
        retention-days: 30

  # Security Testing Job
  security:
    name: 'Security Testing'
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event.inputs.run_security_tests == 'true' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety semgrep
    
    - name: Run Security Scans
      run: |
        echo "Running security analysis..."
        
        # Static analysis with Bandit
        bandit -r src/ -f json -o security-report-bandit.json || true
        
        # Dependency vulnerability scan
        safety check --json --output security-report-safety.json || true
        
        # Semgrep analysis
        semgrep --config=auto --json --output security-report-semgrep.json src/ || true
        
        # Generate summary
        python -c "
        import json
        import os
        
        reports = {}
        for report_file in ['security-report-bandit.json', 'security-report-safety.json', 'security-report-semgrep.json']:
            if os.path.exists(report_file):
                with open(report_file, 'r') as f:
                    reports[report_file] = json.load(f)
        
        print('Security Analysis Summary:')
        for name, data in reports.items():
            if 'results' in data:
                print(f'{name}: {len(data[\"results\"])} issues found')
            elif 'vulnerabilities' in data:
                print(f'{name}: {len(data[\"vulnerabilities\"])} vulnerabilities found')
        
        # Create security score
        total_issues = sum(len(r.get('results', r.get('vulnerabilities', []))) for r in reports.values())
        security_score = max(0, 100 - total_issues * 5)
        print(f'security-score={security_score}')
        "
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          security-report-*.json
        retention-days: 30

  # Core Testing Job
  test:
    name: 'Core Testing'
    runs-on: ubuntu-latest
    needs: [infrastructure, ai-training]
    strategy:
      matrix:
        test-type: [smoke, regression, integration, accessibility]
        include:
          - test-type: smoke
            test-file: tests/test_login.py::test_basic_login_functionality
            parallel: 1
          - test-type: regression
            test-file: tests/test_advanced_login.py::TestAdvancedLogin::test_successful_login
            parallel: 2
          - test-type: integration
            test-file: tests/test_integration.py
            parallel: 2
          - test-type: accessibility
            test-file: tests/test_advanced_login.py::TestAdvancedLogin::test_login_accessibility
            parallel: 1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright pytest-html allure-pytest
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Download AI Models
      uses: actions/download-artifact@v4
      with:
        name: ai-models
        path: data/models/
    
    - name: Run Tests with AI Risk Assessment
      run: |
        echo "Running ${{ matrix.test-type }} tests with AI risk assessment..."
        
        # Get AI risk predictions
        python -c "
        from src.model.predictor import get_defect_predictor
        predictor = get_defect_predictor()
        
        test_names = ['test_login_functionality', 'test_payment_processing']
        predictions = predictor.predict_batch_risks(test_names)
        
        high_risk_tests = [p.test_name for p in predictions if p.risk_score > 0.7]
        print(f'High risk tests: {high_risk_tests}')
        
        # Create test configuration based on risk
        with open('test_config.json', 'w') as f:
            import json
            json.dump({
                'high_risk_tests': high_risk_tests,
                'priority_order': sorted(predictions, key=lambda x: x.risk_score, reverse=True)
            }, f)
        "
        
        # Run tests with Allure reporting
        pytest ${{ matrix.test-file }} \
          --alluredir=allure-results \
          --html=test-report.html \
          --self-contained-html \
          -v \
          --tb=short \
          --maxfail=5
    
    - name: Generate Test Metrics
      run: |
        python -c "
        from src.utils.metrics_collector import get_metrics_collector
        import json
        
        # Collect and analyze test metrics
        collector = get_metrics_collector()
        
        # Generate test summary
        test_summary = {
            'test_type': '${{ matrix.test-type }}',
            'timestamp': '${{ github.run_number }}',
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}'
        }
        
        with open('test-summary.json', 'w') as f:
            json.dump(test_summary, f, indent=2)
        
        print('Test metrics generated')
        "
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test-type }}
        path: |
          allure-results/
          test-report.html
          test-summary.json
          test-*.png
        retention-days: 7

  # Performance Testing Job
  performance:
    name: 'Performance Testing'
    runs-on: ubuntu-latest
    needs: [infrastructure, ai-training]
    if: github.event.inputs.run_performance_tests == 'true' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright pytest-benchmark
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run Performance Tests
      run: |
        echo "Running performance tests..."
        
        pytest tests/test_performance.py \
          --benchmark-only \
          --benchmark-json=benchmark-results.json \
          --benchmark-autosave \
          -v
    
    - name: Analyze Performance Results
      run: |
        python -c "
        import json
        import statistics
        
        try:
            with open('benchmark-results.json', 'r') as f:
                data = json.load(f)
            
            benchmarks = data.get('benchmarks', [])
            if benchmarks:
                durations = [b.get('stats', {}).get('min', 0) for b in benchmarks]
                avg_duration = statistics.mean(durations) if durations else 0
                
                print(f'performance-score={max(0, 100 - avg_duration * 10)}')
                print(f'avg-duration={avg_duration}')
                print(f'total-benchmarks={len(benchmarks)}')
        except Exception as e:
            print(f'performance-score=50')
            print(f'error={str(e)}')
        "
    
    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          benchmark-results.json
        retention-days: 30

  # Vision Healing Testing Job
  vision-healing:
    name: 'Vision Healing Tests'
    runs-on: ubuntu-latest
    needs: infrastructure
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install opencv-python-headless pytest-playwright
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Test Vision Healing
      run: |
        echo "Testing vision healing capabilities..."
        
        pytest tests/test_login.py::test_ai_healing_capabilities \
          -v \
          --tb=short \
          --screenshot=only-on-failure
    
    - name: Test Vision Healing Stats
      run: |
        python -c "
        from src.model.vision_healer import get_vision_healer
        import json
        
        healer = get_vision_healer()
        stats = healer.get_healing_stats()
        
        print('Vision Healing Statistics:')
        print(f'Success rate: {stats[\"success_rate\"]:.1f}%')
        print(f'Total attempts: {stats[\"total_attempts\"]}')
        print(f'Average confidence: {stats[\"average_confidence\"]:.2f}')
        
        with open('vision-healing-stats.json', 'w') as f:
            json.dump(stats, f, indent=2)
        "
    
    - name: Upload Vision Healing Results
      uses: actions/upload-artifact@v4
      with:
        name: vision-healing-results
        path: |
          vision-healing-stats.json
          test-*.png
        retention-days: 7

  # Reporting and Analytics Job
  reporting:
    name: 'Reporting & Analytics'
    runs-on: ubuntu-latest
    needs: [test, performance, vision-healing, security]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib seaborn jinja2
    
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: Generate Executive Dashboard
      run: |
        python -c "
        import json
        import os
        from pathlib import Path
        
        # Collect all test results
        results = {
            'pipeline_id': '${{ github.run_id }}',
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}',
            'timestamp': '${{ github.run_number }}',
            'test_results': {},
            'performance_metrics': {},
            'security_metrics': {},
            'vision_healing_metrics': {},
            'ai_predictions': {}
        }
        
        # Process test results
        test_dirs = [d for d in os.listdir('artifacts/') if d.startswith('test-results-')]
        for test_dir in test_dirs:
            test_type = test_dir.replace('test-results-', '')
            summary_file = f'artifacts/{test_dir}/test-summary.json'
            if os.path.exists(summary_file):
                with open(summary_file, 'r') as f:
                    results['test_results'][test_type] = json.load(f)
        
        # Process performance results
        perf_file = 'artifacts/performance-results/benchmark-results.json'
        if os.path.exists(perf_file):
            with open(perf_file, 'r') as f:
                results['performance_metrics'] = json.load(f)
        
        # Process security results
        security_file = 'artifacts/security-reports/security-report-bandit.json'
        if os.path.exists(security_file):
            with open(security_file, 'r') as f:
                results['security_metrics'] = json.load(f)
        
        # Process vision healing results
        vision_file = 'artifacts/vision-healing-results/vision-healing-stats.json'
        if os.path.exists(vision_file):
            with open(vision_file, 'r') as f:
                results['vision_healing_metrics'] = json.load(f)
        
        # Calculate overall quality score
        test_score = 100  # Base score
        if results['security_metrics']:
            security_issues = len(results['security_metrics'].get('results', []))
            test_score -= security_issues * 2
        
        if results['vision_healing_metrics']:
            success_rate = results['vision_healing_metrics'].get('success_rate', 0)
            test_score = test_score * (success_rate / 100)
        
        results['quality_score'] = max(0, min(100, test_score))
        
        # Save comprehensive report
        with open('executive-report.json', 'w') as f:
            json.dump(results, f, indent=2)
        
        print(f'Quality Score: {results[\"quality_score\"]:.1f}/100')
        print(f'Test Types Executed: {list(results[\"test_results\"].keys())}')
        "
    
    - name: Generate HTML Report
      run: |
        python -c "
        import json
        from jinja2 import Template
        
        # Load report data
        with open('executive-report.json', 'r') as f:
            data = json.load(f)
        
        # HTML template
        html_template = '''
        <!DOCTYPE html>
        <html>
        <head>
            <title>ARES QualityOps Report</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .header { background: #2c3e50; color: white; padding: 20px; border-radius: 5px; }
                .metric { display: inline-block; margin: 10px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
                .high-score { color: #27ae60; font-weight: bold; }
                .medium-score { color: #f39c12; font-weight: bold; }
                .low-score { color: #e74c3c; font-weight: bold; }
                .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
                table { width: 100%; border-collapse: collapse; }
                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                th { background-color: #f2f2f2; }
            </style>
        </head>
        <body>
            <div class=\"header\">
                <h1>ARES QualityOps Executive Report</h1>
                <p>Pipeline ID: {{ data.pipeline_id }} | Commit: {{ data.commit_sha[:8] }} | Branch: {{ data.branch }}</p>
            </div>
            
            <div class=\"section\">
                <h2>Quality Score</h2>
                <div class=\"metric\">
                    <h3 class=\"{% if data.quality_score >= 80 %}high-score{% elif data.quality_score >= 60 %}medium-score{% else %}low-score{% endif %}\">
                        {{ \"%.1f\"|format(data.quality_score) }}/100
                    </h3>
                    <p>Overall Quality Score</p>
                </div>
            </div>
            
            <div class=\"section\">
                <h2>Test Results</h2>
                <table>
                    <tr><th>Test Type</th><th>Status</th><th>Details</th></tr>
                    {% for test_type, results in data.test_results.items() %}
                    <tr>
                        <td>{{ test_type.title() }}</td>
                        <td>Completed</td>
                        <td>{{ results.get('test_type', 'N/A') }}</td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
            
            <div class=\"section\">
                <h2>AI Predictions</h2>
                <p>AI models trained with accuracy: {{ data.ai_predictions.get('model_accuracy', 'N/A') }}</p>
                <p>High-risk tests identified: {{ data.ai_predictions.get('high_risk_count', 0) }}</p>
            </div>
            
            <div class=\"section\">
                <h2>Vision Healing</h2>
                <p>Success Rate: {{ \"%.1f\"|format(data.vision_healing_metrics.get('success_rate', 0)) }}%</p>
                <p>Total Healing Attempts: {{ data.vision_healing_metrics.get('total_attempts', 0) }}</p>
            </div>
        </body>
        </html>
        '''
        
        template = Template(html_template)
        html_output = template.render(data=data)
        
        with open('executive-report.html', 'w') as f:
            f.write(html_output)
        
        print('Executive report generated')
        "
    
    - name: Upload Executive Report
      uses: actions/upload-artifact@v4
      with:
        name: executive-report
        path: |
          executive-report.html
          executive-report.json
        retention-days: 30

  # Notification Job
  notify:
    name: 'Send Notifications'
    runs-on: ubuntu-latest
    needs: [reporting]
    if: always()
    
    steps:
    - name: Download Executive Report
      uses: actions/download-artifact@v4
      with:
        name: executive-report
        path: report/
    
    - name: Send Slack Notification
      if: env.SLACK_WEBHOOK_URL != ''
      run: |
        # Read quality score from report
        QUALITY_SCORE=$(python -c "
        import json
        try:
            with open('report/executive-report.json', 'r') as f:
                data = json.load(f)
            print(data.get('quality_score', 0))
        except:
            print(0)
        ")
        
        # Determine message color
        if [ $QUALITY_SCORE -ge 80 ]; then
            COLOR='good'
            STATUS='SUCCESS'
        elif [ $QUALITY_SCORE -ge 60 ]; then
            COLOR='warning'
            STATUS='WARNING'
        else
            COLOR='danger'
            STATUS='FAILED'
        fi
        
        # Send Slack notification
        curl -X POST -H 'Content-type: application/json' \
          --data-binary '{
            \"text\": \"ARES QualityOps Pipeline #${{ github.run_number }} - ${STATUS}\",
            \"attachments\": [{
              \"color\": \"'$COLOR'\",
              \"fields\": [
                {
                  \"title\": \"Quality Score\",
                  \"value\": \"'$QUALITY_SCORE'/100\",
                  \"short\": true
                },
                {
                  \"title\": \"Branch\",
                  \"value\": \"${{ github.ref_name }}\",
                  \"short\": true
                },
                {
                  \"title\": \"Commit\",
                  \"value\": \"${{ github.sha }}\",
                  \"short\": true
                },
                {
                  \"title\": \"Pipeline URL\",
                  \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                  \"short\": false
                }
              ]
            }]
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Send Teams Notification
      if: env.TEAMS_WEBHOOK_URL != ''
      run: |
        QUALITY_SCORE=$(python -c "
        import json
        try:
            with open('report/executive-report.json', 'r') as f:
                data = json.load(f)
            print(data.get('quality_score', 0))
        except:
            print(0)
        ")
        
        curl -X POST -H 'Content-Type: application/json' \
          --data-binary '{
            \"@type\": \"MessageCard\",
            \"@context\": \"http://schema.org/extensions\",
            \"themeColor\": \"'$([ $QUALITY_SCORE -ge 80 ] && echo \"00FF00\" || [ $QUALITY_SCORE -ge 60 ] && echo \"FFA500\" || echo \"FF0000\")'\",
            \"summary\": \"ARES QualityOps Pipeline #${{ github.run_number }}\",
            \"sections\": [{
              \"activityTitle\": \"ARES QualityOps Pipeline\",
              \"activitySubtitle\": \"Run #${{ github.run_number }} on ${{ github.ref_name }}\",
              \"facts\": [{
                \"name\": \"Quality Score\",
                \"value\": \"'$QUALITY_SCORE'/100\"
              }, {
                \"name\": \"Commit\",
                \"value\": \"${{ github.sha[:8] }}\"
              }, {
                \"name\": \"Branch\",
                \"value\": \"${{ github.ref_name }}\"
              }],
              \"markdown\": true
            }],
            \"potentialAction\": [{
              \"@type\": \"OpenUri\",
              \"name\": \"View Pipeline\",
              \"targets\": [{
                \"os\": \"default\",
                \"uri\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
      env:
        TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    
    - name: Send Email Notification
      if: env.SMTP_HOST != ''
      run: |
        QUALITY_SCORE=$(python -c "
        import json
        try:
            with open('report/executive-report.json', 'r') as f:
                data = json.load(f)
            print(data.get('quality_score', 0))
        except:
            print(0)
        ")
        
        python -c "
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        import os
        
        # Read HTML report
        with open('report/executive-report.html', 'r') as f:
            html_content = f.read()
        
        # Create email
        msg = MIMEMultipart('alternative')
        msg['Subject'] = f'ARES QualityOps Report #${{ github.run_number }} - Quality Score: {os.environ[\"QUALITY_SCORE\"]}/100'
        msg['From'] = '${{ secrets.EMAIL_FROM }}'
        msg['To'] = '${{ secrets.EMAIL_TO }}'
        
        # Attach HTML
        html_part = MIMEText(html_content, 'html')
        msg.attach(html_part)
        
        # Send email
        try:
            server = smtplib.SMTP('${{ secrets.SMTP_HOST }}', ${{ secrets.SMTP_PORT }})
            server.starttls()
            server.login('${{ secrets.SMTP_USERNAME }}', '${{ secrets.SMTP_PASSWORD }}')
            server.send_message(msg)
            server.quit()
            print('Email notification sent successfully')
        except Exception as e:
            print(f'Failed to send email: {e}')
        "
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        QUALITY_SCORE: ${{ env.QUALITY_SCORE }}

  # Cleanup Job
  cleanup:
    name: 'Cleanup Resources'
    runs-on: ubuntu-latest
    needs: [notify]
    if: always()
    
    steps:
    - name: Cleanup Docker Resources
      run: |
        echo "Cleaning up Docker resources..."
        docker-compose down -v
        docker system prune -f
        echo "Cleanup completed"
